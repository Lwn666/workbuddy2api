name: Build fnOS fpk

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "config.example.json"
      - "Dockerfile"
      - "wb2api-fpk/**"
      - "wb2api-fpk-arm/**"
      - "scripts/build-fpk.sh"
  pull_request:
    branches: ["master"]
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: write
  packages: read

jobs:
  build-fpk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      # 同步上游由 push 前手动完成；此处用仓库内已同步代码直接构建

      - name: Build fpk packages
        id: build
        run: |
          sh scripts/build-fpk.sh "${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          echo "VERSION=$(grep '^version=' wb2api-fpk/manifest | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          ls -la dist/

      - name: Upload fpk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workbuddy2api-fpk
          path: dist/*.fpk
          if-no-files-found: error

      - name: Create Release (tag only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.fpk
          generate_release_notes: true
          fail_on_unmatched_files: true
