name: Auto Sync Upstream

on:
  schedule:
    # 每 6 小时检查一次上游更新
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (sync only, no push)'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Sync upstream
        id: sync
        run: |
          sh scripts/sync-wb2-fork.sh --ci 2>&1 | tee /tmp/sync.log
          if grep -q 'SYNC_NO_CHANGE=1' /tmp/sync.log; then
            echo "has_change=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_change=true" >> "$GITHUB_OUTPUT"
          fi

      - name: No upstream changes
        if: steps.sync.outputs.has_change == 'false'
        run: echo "已是最新，无需同步。"

      - name: Verify compilation
        if: steps.sync.outputs.has_change == 'true'
        run: |
          CGO_ENABLED=0 go vet ./cmd/server
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/server
          echo "✓ 编译通过"

      - name: Bump fpk version and commit
        if: steps.sync.outputs.has_change == 'true'
        id: version
        run: |
          # 读当前版本，递增 patch
          CUR=$(grep '^version=' wb2api-fpk/manifest | cut -d= -f2)
          NEW=$(echo "$CUR" | awk -F. '{printf "%d.%d.%d", $1, $2, $3+1}')
          echo "version=$CUR -> $NEW"
          for f in wb2api-fpk/manifest wb2api-fpk-arm/manifest; do
            sed -i "s/^version=.*/version=$NEW/" "$f"
          done
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"

          # 配置提交身份
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "auto sync upstream: $(date -u +%Y%m%d) -> v$NEW"

      - name: Push master & tag
        if: steps.sync.outputs.has_change == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin master
          git tag "v${{ steps.version.outputs.new_version }}"
          git push origin "v${{ steps.version.outputs.new_version }}"
          echo "✓ 已推送 master 和 tag v${{ steps.version.outputs.new_version }}"

      # 失败通知：任何步骤失败时自动开 Issue（避免静默失败）
      - name: Create failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$'Auto Sync Upstream 失败，需人工介入。\n\n**Run:** [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n**原因:** 上游更新可能破坏了 LOCAL PATCH 锚点 / fork 依赖符号 / 编译失败\n\n处理方式: 查看 workflow 日志 → 修复 scripts/sync-wb2-fork.sh 或本地代码 → 手动 workflow_dispatch 重试。'
          gh issue create --title "⚠️ auto-sync upstream failed (run ${{ github.run_id }})" --body "$BODY" --label "auto-sync" 2>&1 | tail -1 || true